<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enquiries dashboard | wirral.ai</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=cabinet-grotesk@500,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
  </head>
  <body>
    <header class="site-header" id="siteHeader" style="position: static">
      <div class="wrap header-inner">
        <a class="brand" href="/" aria-label="wirral.ai home">
          <img class="brand-logo" src="/assets/logo-mark-96.png" width="34" height="34" alt="" />
          <span class="brand-word">wirral<span>.ai</span></span>
        </a>
        <span class="dash-title">Enquiries dashboard</span>
      </div>
    </header>

    <main class="wrap dash-wrap">
      <div id="dashGate" class="dash-gate">
        <h1>Enquiries dashboard</h1>
        <p class="lede">Enter the dashboard token to view Build With Us submissions.</p>
        <div class="field">
          <label for="dashToken">Dashboard token</label>
          <input id="dashToken" type="password" autocomplete="off" />
        </div>
        <button type="button" class="btn btn--primary" id="dashUnlock">Unlock</button>
        <p class="dash-error" id="dashGateError"></p>
      </div>

      <div id="dashApp" class="dash-app" hidden></div>
    </main>

    <script src="/dashboard/dashboard.js" defer></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
